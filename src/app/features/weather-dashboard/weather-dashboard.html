<main class="dashboard-wrapper">
  <div class="glass-grid-layout">
    <!-- Centro Arriba: Clima Actual (Foco principal) -->
    <app-current-weather
      class="ghost-card area-current"
      [current]="currentWeather"
      [locationData]="location"
    >
    </app-current-weather>

    <!-- Derecha: Lista vertical (Más largo que ancho) -->
    <app-hourly-weather class="ghost-card area-hourly" [hourly]="currentWeather">
    </app-hourly-weather>

    <!-- Izquierda Arriba: Calidad del Aire (Cuadrado compacto) -->
    <app-air class="ghost-card area-air" [air]="airQuality"> </app-air>

    <!-- Izquierda Abajo: Índice UV (Cuadrado compacto) -->
    <app-uv-index class="ghost-card area-uv" [uvIndex]="currentWeather"></app-uv-index>

    <!-- Centro Abajo: Gráfico Semanal (Cuadrado más grande) -->
    <app-weekly-weather class="ghost-card area-weekly" [weekly]="weeklyWeather">
    </app-weekly-weather>
  </div>
</main>
