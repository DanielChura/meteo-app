<main class="dashboard-wrapper">
  <div class="glass-grid-layout">
    <app-current-weather
      class="ghost-card area-current"
      [current]="currentWeather"
      [locationData]="location"
    >
    </app-current-weather>

    <app-daily-forecast class="ghost-card area-hourly" [hourly]="currentWeather">
    </app-daily-forecast>

    <app-air-quality class="ghost-card area-air" [air]="airQuality"> </app-air-quality>

    <app-uv-index class="ghost-card area-uv" [uvIndex]="currentWeather"></app-uv-index>

    <app-hourly-chart class="ghost-card area-weekly" [weekly]="weeklyWeather">
    </app-hourly-chart>
  </div>
</main>
