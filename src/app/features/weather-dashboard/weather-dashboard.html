<main class="dashboard-container">
  <div class="grid-layout">
    <app-current-weather
      class="grid-item item-current"
      [current]="currentWeather"
      [locationData]="location"
    ></app-current-weather>

    <app-hourly-weather
      class="grid-item item-hourly"
      [hourly]="currentWeather"
    ></app-hourly-weather>
    <app-air class="grid-item item-air" [air]="airQuality"></app-air>

    <div class="grid-item empty-placeholder item-uv">
      <span>UV Index</span>
    </div>
    <app-weekly-weather class="grid-item item-weekly" [weekly]="weeklyWeather">
    </app-weekly-weather>
  </div>
</main>
