<div class="weekly-container">
  <div class="days-toggle">
    @for (key of keys(); track key) {
      <button class="ghost-inner-card day-btn" [class.active]="activeKey() === key" (click)="createChart(key)">
        {{ key }}
      </button>
    }
  </div>

  <div class="chart-wrapper">
    <canvas #chartJS></canvas>
  </div>
</div>
