<div class="flex flex-col h-full w-full gap-4 items-center">
  <div class="flex gap-2 overflow-x-auto justify-between">
    @for (key of keys(); track key) {
      <button
        class="text-slate-500 py-1.5 px-3 text-sm font-medium cursor-pointer capitalize whitespace-nowrap border border-slate-200 rounded-lg transition-all duration-150 hover:text-slate-900 hover:border-slate-300"
        [class.border-slate-400]="activeKey() === key"
        [class.text-slate-900]="activeKey() === key"
        (click)="createChart(key)"
      >
        {{ key }}
      </button>
    }
  </div>

  <div class="flex-1 relative w-full h-0 min-h-0">
    <canvas #chartJS class="absolute top-0 left-0 w-full h-full"></canvas>
  </div>
</div>
