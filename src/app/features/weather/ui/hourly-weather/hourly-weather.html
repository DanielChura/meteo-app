<main class="hourly-weather-list">
  @for (day of DayW().date; track day; let i = $index) {
    <div class="ghost-inner-card day-card">
      <div class="day-info">
        <span class="day-name">{{ day }}</span>
        <span class="weather-desc">{{ (DayW().codes[i] | iconWeather).description }}</span>
      </div>

      <ng-icon
        [name]="(DayW().codes[i] | iconWeather).icon"
        size="1.8rem"
        class="weather-icon"
      ></ng-icon>

      <div class="day-temp">
        <span class="temp-max">{{ DayW().tempMax[i] }}°</span>
        <span class="temp-min">{{ DayW().tempMin[i] }}°</span>
      </div>
    </div>
  }
</main>
