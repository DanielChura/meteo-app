@if (uvIndex(); as data) {
  <div class="flex flex-col gap-4 h-full w-full">
    <article
      class="border border-slate-200 rounded-xl transition-colors duration-150 hover:border-slate-300 p-5 flex-1 flex flex-col justify-between"
    >
      <header class="flex justify-between items-center w-full mb-3">
        <div class="flex items-center gap-2">
          <ng-icon
            name="phosphorSunBold"
            class="text-lg text-slate-600"
            [style.color]="uvData().color"
          ></ng-icon>
          <span class="text-sm font-medium text-slate-600">Índice UV</span>
        </div>
        <span class="text-sm font-medium text-slate-900" [style.color]="uvData().color">{{
          uvData().status
        }}</span>
      </header>

      <div class="flex flex-col justify-center flex-1 gap-2">
        <span class="text-2xl font-mono text-slate-900">{{ uvData().value }}</span>
        <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
          <div
            class="h-full rounded-full transition-all duration-300"
            [style.width.%]="uvData().percentage"
            [style.backgroundColor]="uvData().color"
          ></div>
        </div>
      </div>

      <footer class="mt-auto pt-3">
        <p class="text-sm text-slate-500 leading-normal m-0 font-normal">
          {{ uvData().recommendation }}
        </p>
      </footer>
    </article>

    <article
      class="border border-slate-200 rounded-xl transition-colors duration-150 hover:border-slate-300 p-5 flex-1 flex flex-col justify-between"
    >
      <header class="flex justify-between items-center w-full mb-3">
        <div class="flex items-center gap-2">
          <ng-icon
            name="phosphorDropBold"
            class="text-lg text-slate-600"
            [style.color]="humidityData().color"
          ></ng-icon>
          <span class="text-sm font-medium text-slate-600">Humedad</span>
        </div>
        <span class="text-sm font-medium text-slate-900" [style.color]="humidityData().color">{{
          humidityData().status
        }}</span>
      </header>

      <div class="flex flex-col justify-center flex-1 gap-2">
        <div class="flex items-baseline gap-2">
          <span class="text-2xl font-mono text-slate-900">{{ humidityData().value }}</span>
          <small class="text-sm text-slate-600">%</small>
        </div>
        <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
          <div
            class="h-full rounded-full transition-all duration-300"
            [style.width.%]="humidityData().percentage"
            [style.backgroundColor]="humidityData().color"
          ></div>
        </div>
      </div>

      <footer class="mt-auto pt-3">
        <p class="text-sm text-slate-500 leading-normal m-0 font-normal">
          {{ humidityData().recommendation }}
        </p>
      </footer>
    </article>
  </div>
}
